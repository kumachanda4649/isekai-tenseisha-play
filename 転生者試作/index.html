<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異世界転生者になろう</title>
<style>
:root {
  --bg: #12162b; --bg2: #181e3a; --panel: #1f2748; --panel2: #262f58; --line: #36406e;
  --text: #efe6d2; --muted: #a8a496; --gold: #e3c27a; --blue: #7fa6e0;
  --good: #7fc79a; --good2: #a9d98c; --warn: #e3b266; --bad: #e27f7f; --dim: .45;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.85 system-ui, "Yu Gothic UI", "Meiryo", sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; line-height: 1.5; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: #3c4f8f; border-color: #5a73c0; font-weight: 600; }
button.gold { background: #6b5a2c; border-color: var(--gold); color: #fff4d6; font-weight: 600; }
input[type=number] { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; width: 7em; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

#app { max-width: 1560px; margin: 0 auto; padding: 0 16px 40px; }
#top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
#top h1 { font-size: 18px; margin: 0 auto 0 0; letter-spacing: .08em; color: var(--gold); font-weight: 600; }
#msg { flex-basis: 100%; min-height: 1.5em; color: var(--good2); font-size: 14px; }

#game { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
#left { min-width: 0; } #hand { margin-top: 12px; } #side { min-width: 0; }
@media (min-width: 1100px) {
  #game { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
  #hand { position: sticky; bottom: 0; z-index: 5; padding-top: 4px; background: linear-gradient(to bottom, rgba(18,22,43,0), var(--bg) 14px); }
  #hand .box { box-shadow: 0 -6px 18px rgba(0,0,0,.45); padding: 10px 14px; }
  #hand .gods { margin-bottom: 6px; }
  #hand .cards { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }   /* 札は必ず横一列 */
  #hand .card { padding: 4px 8px; min-width: 0; } #hand .card .eff, #hand .card .why { display: none; }
  #hand .card .nm { font-size: 15px; flex-wrap: wrap; gap: 0 6px; } #hand .card .fit b { margin-right: 0; }
  #hand .actions { margin-top: 8px; }
  /* 遊んでいる間は、ページ全体を動かさない。場面の絵と手札は動かず、文の欄と右の欄だけが、それぞれの中でスクロールする */
  body.playing { overflow: hidden; }
  body.playing #app { height: 100vh; display: flex; flex-direction: column; padding-bottom: 10px; }
  body.playing #top { flex: none; margin-bottom: 10px; padding: 8px 0; }
  body.playing #root { flex: 1; min-height: 0; }
  body.playing #game { height: 100%; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
  body.playing #left { display: flex; flex-direction: column; min-height: 0; }
  body.playing #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.playing #main > .box { flex: none; }
  body.playing #main > .box:last-child { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  body.playing #main.over { display: block; overflow-y: auto; overscroll-behavior: contain; }
  body.playing #main.over > .box:last-child { overflow: visible; }
  body.playing #hand { position: static; flex: none; background: none; margin-top: 10px; padding-top: 0; }
  body.playing #side { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
  body.playing #side .tabs { position: sticky; top: 0; z-index: 3; background: var(--bg); padding-bottom: 6px; margin-bottom: 4px; }
}
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.box + .box { margin-top: 12px; }
h2 { font-size: 16px; margin: 0 0 6px; color: var(--gold); font-weight: 600; }
h3 { font-size: 15px; margin: 10px 0 4px; color: var(--blue); font-weight: 600; }

/* 場面 */
.sceneBox { padding: 0; overflow: hidden; background: #0a0d1c; text-align: center; }
.sceneBox canvas { margin: 0 auto; }
.evHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.evHead .t { font-size: 19px; font-weight: 600; }
.chip { display: inline-block; font-size: 14px; line-height: 1.6; padding: 0 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); margin: 2px 4px 2px 0; }
.chip.kind-crisis { border-color: var(--bad); color: #ffc9c9; } .chip.kind-calm { border-color: var(--good); color: #cdeed9; } .chip.warnc { border-color: var(--warn); color: #ffe2b0; }
.stake { color: var(--gold); font-size: 14px; margin: 2px 0 6px; }
.lines p { margin: 6px 0; }
.lines p.lsay { padding-left: 10px; border-left: 3px solid #5a73c0; background: rgba(90,115,192,.10); border-radius: 0 8px 8px 0; }
.lines p.lsay b { color: var(--blue); font-weight: 600; }
.lines p.lc { color: var(--muted); font-size: 14px; margin: 12px 0 2px; border-top: 1px dashed var(--line); padding-top: 6px; }
.lines p.ln { color: var(--warn); font-size: 14px; font-style: italic; }
.lines p.ln.trigLine { color: #ffb3b3; border-left: 3px solid #a24b4b; padding-left: 8px; }
.lines p.lt { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0 4px; letter-spacing: .15em; }
.trigBanner { background: #3a2230; border: 1px solid #a24b4b; color: #ffd9d9; border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-size: 14px; }
.memo { color: var(--muted); font-size: 13px; }
.lines .tags { margin: 0 0 6px; }
.bar { height: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--blue); }
.bar.chance i { background: linear-gradient(90deg, #c46a6a, #e3b266, #7fc79a); background-size: 100vw 100%; }
.chanceRow { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.chanceRow .bar { flex: 1; height: 14px; } .chanceRow b { min-width: 6em; font-size: 14px; }
.cardMsg { border-left: 4px solid var(--gold); padding: 4px 12px; margin: 8px 0; background: rgba(227,194,122,.08); border-radius: 0 8px 8px 0; }
.cardMsg.bad { border-color: var(--bad); background: rgba(226,127,127,.08); }
.hint { color: var(--muted); font-size: 14px; }
.outcome { display: inline-block; font-weight: 700; padding: 0 12px; border-radius: 8px; margin-right: 8px; }
.outcome.win { background: #2e5a42; color: #d9f5e3; } .outcome.lose { background: #6a3434; color: #ffd9d9; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tag { font-size: 14px; line-height: 1.6; padding: 1px 10px 1px 8px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); flex: none; }
.tag.item::before { background: var(--gold); } .tag.skill::before { background: var(--blue); border-radius: 50%; }
.tag.rel::before { background: #d98ac0; transform: rotate(45deg); } .tag.up::before { background: var(--good); } .tag.down::before { background: var(--bad); }
.tag.sys::before { background: #9a8fd8; } .tag.lost { opacity: .75; } .tag.thread::before { background: #6fd0d0; border-radius: 50%; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.parts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; margin: 0 0 6px; line-height: 1.6; }
.part { padding: 0 8px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--line); color: var(--muted); }
.part.up { color: var(--good2); border-color: #4f9d70; } .part.down { color: #ff9a9a; border-color: #a45353; }
/* 分かれ目 */
.choiceBox { margin-top: 14px; border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px 12px; background: rgba(227,194,122,.05); }
.choiceBox h2 { font-size: 17px; }
.opts { display: grid; gap: 8px; margin: 8px 0; }
.opt { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.opt.is-then { border-color: #5a73c0; background: #232c58; }
.opt .oh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.opt .oh b { font-size: 16px; }
.opt .say { margin: 2px 0 2px; }
.mark { font-size: 14px; line-height: 1.6; padding: 0 9px; border-radius: 6px; font-weight: 600; }
.mark.first { background: #6b5a2c; color: #fff1cf; } .mark.then { background: #34456e; color: #dbe6ff; } .mark.trig { background: #6a3434; color: #ffd9d9; }
/* 結び */
.wrapUp { margin-top: 14px; border-top: 2px solid var(--gold); padding-top: 8px; }
.ending { border: 2px solid var(--gold); }
.endBig { font-size: 34px; letter-spacing: .12em; color: var(--gold); text-align: center; margin: 2px 0 8px; font-weight: 700; line-height: 1.4; }
.endHero { display: flex; justify-content: center; margin: 6px 0; } .endHero .sp { background: #0a0d1c; border-radius: 10px; padding: 6px 10px; }
.endText { font-size: 16px; line-height: 2; margin: 8px 0; }
.endFolk { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 8px 0; }
.folk { display: flex; flex-direction: column; align-items: center; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.folk .sp { background: #0a0d1c; border-radius: 6px; padding: 2px; } .folk.foe { border-color: #a45353; }
.yearHead { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px -8px; color: var(--gold); font-weight: 600; }
.yearHead::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .55; }
.relMap { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1 / 0.9; margin: 0 auto 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 640px) { .relMap { aspect-ratio: 1 / 1.25; } }
.relMap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rnode { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; background: rgba(10,13,28,.82); border: 2px solid var(--line); border-radius: 10px; padding: 2px 4px 0; line-height: 1.3; font-size: 14px; max-width: 96px; }
.rnode .sp { display: block; } .rnode .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px; }
.rnode.hero { border-color: var(--gold); } .rnode.dead { opacity: .45; } .rnode.foe { border-color: var(--bad); } .rnode.love { border-color: #d98ac0; } .rnode.ally { border-color: var(--good); }
.legend { font-size: 14px; color: var(--muted); text-align: center; margin: -6px 0 10px; }
.sumGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 10px 0; }
.sumGrid div { background: var(--bg2); border-radius: 8px; padding: 6px 10px; text-align: center; } .sumGrid b { display: block; font-size: 20px; color: var(--gold); }

/* 下の帯 */
.gods { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin-bottom: 10px; }
.gods .g { display: flex; align-items: center; gap: 8px; }
.orb { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #e3b24f 55%, #a67a22); display: inline-block; margin-right: 3px; }
.orb.off { background: transparent; border: 1px solid var(--line); }
.heart { display: inline-block; width: 20px; height: 18px; margin-right: 2px; vertical-align: middle; } .heart svg { width: 100%; height: 100%; display: block; }
.bond { width: 150px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; text-align: left; line-height: 1.6; display: block; width: 100%; }
.card .nm { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 16px; }
.card .cost { font-size: 14px; color: var(--gold); font-weight: 400; }
.card .eff { font-size: 14px; color: var(--muted); }
.card .fit { font-size: 14px; margin-top: 4px; }
.card .fit b { display: inline-block; padding: 0 8px; border-radius: 6px; margin-right: 6px; }
.card .why { color: var(--muted); font-size: 14px; display: block; }
.card.e2 { border-color: #4f9d70; } .e2 .fit b { background: #2e5a42; color: #d9f5e3; }
.card.e1 { border-color: #5d8a6a; } .e1 .fit b { background: #355142; color: #d9f5e3; }
.e0 .fit b { background: #3a4263; color: #e0e4f5; }
.card.m1 { border-color: #9a7a40; } .m1 .fit b { background: #6b5a2c; color: #ffeec8; }
.card.m2 { border-color: #a45353; } .m2 .fit b { background: #6a3434; color: #ffd9d9; }
.card.off { opacity: var(--dim); cursor: default; }
.card.off:hover { border-color: var(--line); }
.card .reason { display: block; font-size: 14px; color: var(--warn); }

/* 右 */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.tabs button { border-radius: 8px 8px 0 0; padding: 4px 16px; background: var(--bg2); }
.tabs button.on { background: var(--panel2); border-color: var(--gold); color: var(--gold); }
#side .box { min-height: 200px; }
.kv { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 10px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; margin: 8px 0; }
.stats div { background: var(--bg2); border-radius: 8px; padding: 2px 8px; text-align: center; font-size: 14px; line-height: 1.5; } .stats b { display: block; font-size: 18px; color: var(--gold); }
.person { display: flex; gap: 14px; align-items: flex-start; }
.person .sp { background: #0a0d1c; border-radius: 8px; padding: 4px; flex: none; }
.person .info { flex: 1; min-width: 0; }
.rows { display: grid; gap: 8px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px 6px 8px; text-align: left; width: 100%; }
.row .sp { background: #0a0d1c; border-radius: 6px; flex: none; padding: 2px; }
.row .bd { flex: 1; min-width: 0; line-height: 1.6; }
.row.dead { opacity: .55; }
.tbar { height: 10px; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; margin: 3px 0; overflow: hidden; }
.tbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); }
.tbar i { position: absolute; top: 0; bottom: 0; } .tbar i.pos { background: var(--good); } .tbar i.neg { background: var(--bad); }
.tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 12px; }
.ev { margin: 0 0 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; }
.ev > button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 6px 12px; }
.ev .sum { color: var(--muted); font-size: 14px; display: block; }
.ev .detail { padding: 0 12px 10px; border-top: 1px solid var(--line); }
.ev .detail p { margin: 4px 0; }
.threads { margin-bottom: 10px; }
.threadRow { background: var(--bg2); border: 1px solid var(--line); border-left: 4px solid #6fd0d0; border-radius: 8px; padding: 4px 10px; margin-bottom: 6px; font-size: 14px; line-height: 1.6; }
.threadRow.open { border-left-color: var(--warn); }
.catHead { margin: 12px 0 4px; font-weight: 600; color: var(--blue); border-bottom: 1px solid var(--line); }
.item { padding: 6px 10px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.item.gone { opacity: .5; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 8px; } .pips i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--blue); } .pips i.on { background: var(--blue); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }

/* 最初の画面 */
#startHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
#startHead h2 { margin: 0 auto 0 0; font-size: 18px; }
.candGrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.cand { display: flex; flex-direction: column; gap: 6px; }
.cand .top { display: flex; gap: 12px; align-items: flex-start; }
.cand .nm { font-size: 18px; font-weight: 600; }
.cand .grow { flex: 1; }
.cand .sp { background: #0a0d1c; border-radius: 8px; padding: 4px; flex: none; }

/* ---- 転生者試作 ---- */
a { color: var(--blue); }
.startTabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.startTabs button { padding: 8px 22px; font-size: 16px; border-radius: 10px; background: var(--bg2); }
.startTabs button.on { background: var(--panel2); border-color: var(--gold); color: var(--gold); font-weight: 600; }
.lead { color: var(--muted); margin: 0 0 12px; }
.choiceBox .qline { color: var(--muted); margin: 0 0 8px; }
.optWrap { display: block; }
.optMain { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px; background: var(--bg2); border: 1px solid #5a73c0; line-height: 1.6; }
.optMain:hover:not(:disabled) { background: #232c58; border-color: var(--gold); }
.optMain.hold { border-color: #a45353; }
.optMain .oh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.optMain .oh b { font-size: 17px; }
.optMain .marks { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 3px 0; }
.optMain .say { display: block; margin: 2px 0 4px; }
.cw { display: inline-block; font-weight: 700; padding: 0 10px; border-radius: 6px; font-size: 14px; }
.cw.good { background: #2e5a42; color: #d9f5e3; } .cw.mid { background: #6b5a2c; color: #ffeec8; } .cw.bad { background: #6a3434; color: #ffd9d9; }
.mark.both { background: #4b3f6e; color: #ece4ff; }
.mark.hold { background: #3a2230; color: #ffd9d9; border: 1px solid #a45353; }
.detailBtn { font-size: 13px; padding: 0 12px; margin: 4px 0 0 4px; border-radius: 6px; }
.detailBox { margin: 4px 4px 0; }
.skipped { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
.skip { display: inline-block; padding: 0 9px; margin: 2px 6px 2px 0; border: 1px dashed var(--line); border-radius: 6px; opacity: .65; }
.lines p.ln.personaLine { color: var(--gold); border-left: 3px solid var(--gold); padding-left: 8px; font-style: normal; font-weight: 600; }
.cardMsg.voice { border-color: var(--blue); background: rgba(127,166,224,.08); }
.band { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
.band .g { display: flex; align-items: center; gap: 8px; }
.kdots { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.kdots i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #dfe9ff, #7fa6e0 55%, #3c4f8f); }
.kdots i.off { background: transparent; border: 1px solid var(--line); }
.prayRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.growRow { margin: 4px 0; }
.chip.lean { border-color: #5a73c0; }
.fgrid { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 8px 0 12px; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fld > label { color: var(--muted); font-size: 14px; }
.fld select, .fld input[type=text], .fld input[type=number] { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 100%; min-width: 0; }
.fld .row2 { display: flex; gap: 6px; }
.formErr { color: var(--bad); min-height: 1.6em; }
.formPrev { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.formPrev .sp { background: #0a0d1c; border-radius: 8px; padding: 4px; flex: none; }
.lifeBox h2 { margin-bottom: 4px; }
@media (max-width: 640px) {
  .startTabs button { flex: 1; padding: 8px 10px; }
  .optMain .oh b { font-size: 16px; }
  .endBig { font-size: 26px; }
}
/* ---- ゆっくり続ける版 ---- */
.modeGrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 12px; }
.modeCard { display: flex; flex-direction: column; gap: 8px; }
.modeCard h2 { font-size: 19px; }
.modeCard.main { border-color: var(--gold); }
.hubHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.hubHead .dateBig { font-size: 20px; font-weight: 600; color: var(--gold); letter-spacing: .03em; }

<body>
<div id="app">
  <div id="top"></div>
  <div id="root"><div class="box muted">台本を読み込んでいる…</div></div>
</div>

<script src="../人物生成/persona-data.js"></script>
<script src="../人物生成/persona-core.js"></script>
<script src="../人物生成/persona-lines.js"></script>
<script src="../人物生成/persona-voice.js"></script>
<script src="../背景合成/描き込み試作/chara2.js"></script>
<script src="../背景合成/描き込み試作/rich-core.js"></script>
<script src="../人生試作/items-data.js"></script>
<script src="../物語試作/story-data.js"></script>
<script>
// 台本（episodes\*.js）の一覧は episodes/index.json（serve.mjs が返す）。台本を足してもコードは直さない。
// _ で始まる確認用の台本は、?check=1 のとき、または他に台本が無いときだけ読み込まれる。
(function () {
  'use strict';
  function loadScript(src) { return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error('読み込めない: ' + src)); document.head.appendChild(s); }); }
  const q = new URLSearchParams(location.search).get('check') === '1' ? '?check=1' : '';
  (async () => {
    let list = [];
    try { list = await (await fetch('../物語試作/episodes/index.json' + q, { cache: 'no-store' })).json(); } catch (e) { document.getElementById('root').textContent = '台本の一覧を取れなかった：' + e.message; return; }
    // 小さな場面（moments\*.js）と会話（talks\*.js）の一覧も、同じ規則で serve.mjs が返す
    let mlist = [], tlist = [], rlist = [];
    try { mlist = await (await fetch('moments/index.json' + q, { cache: 'no-store' })).json(); tlist = await (await fetch('talks/index.json' + q, { cache: 'no-store' })).json(); } catch (e) { mlist = []; tlist = []; }
    try { rlist = await (await fetch('rumors/index.json' + q, { cache: 'no-store' })).json(); } catch (e) { rlist = []; }   // 台本ごとの噂の文（rumors\*.js）。無くても遊べる
    try {
      globalThis.MomentEpisodes = globalThis.MomentEpisodes || []; globalThis.TalkLines = globalThis.TalkLines || [];
      for (const f of list) await loadScript('../物語試作/episodes/' + encodeURIComponent(f));
      await loadScript('../物語試作/world/world-data.js'); await loadScript('../物語試作/world/story-world.js');   // 世界の地図（国・場所・道・施設）。物語試作の world\ を読む
      await loadScript('../物語試作/story-core.js'); await loadScript('player-core.js');
      for (const f of mlist) await loadScript('moments/' + encodeURIComponent(f));
      for (const f of tlist) await loadScript('talks/' + encodeURIComponent(f));
      // 噂の文：各ファイルは globalThis.StoryRumors = { 台本のid: [噂の文, …] } を代入する。ファイルごとに受け取って合わせる
      const merged = {};
      for (const f of rlist) { globalThis.StoryRumors = undefined; try { await loadScript('rumors/' + encodeURIComponent(f)); } catch (e) { continue; } const r = globalThis.StoryRumors || {}; Object.keys(r).forEach(k => { merged[k] = (merged[k] || []).concat(r[k]); }); }
      globalThis.StoryRumors = merged;
      await loadScript('town-core.js');
    }
    catch (e) { document.getElementById('root').textContent = e.message; return; }
    globalThis.__episodeFiles = list; globalThis.__momentFiles = mlist; globalThis.__talkFiles = tlist; globalThis.__rumorFiles = rlist;
    document.dispatchEvent(new Event('story-ready'));
  })();
})();
</script>
<script>
(function () {
'use strict';
document.addEventListener('story-ready', () => { init(); });
function init() {
const Story = globalThis.Story, Player = globalThis.Player, Town = globalThis.Town, D = globalThis.StoryData, PD = globalThis.PersonaData, Persona = globalThis.Persona, Chara2 = globalThis.Chara2, RC = globalThis.RichCore;
const SAVE_KEY = Player.SAVE_KEY, SAVE_KEY2 = Town.SAVE_KEY2;
const TIME_NAME = { day: '昼', dusk: '夕方', night: '夜' };
const OUT_NAME = { win: '成功', lose: '失敗' };
const END_BIG = { wish: '成就', death: '命が尽きた', peace: '余生', abandon: '神を捨てた' };
const TAB_NAME = [['person', '人'], ['log', '年表'], ['rel', '関係'], ['items', '持ち物'], ['skills', 'スキル']];
const THREAD_LABEL = { debt: '恩', omen: '兆し', feud: '因縁', promise: '約束', secret: '秘密', illness: '病の兆し', rival: '好敵手', grudge: '恨み',
  tensei_trace: '転生の手がかり', kin_in_forest: '森の家族', road_raiders: '街道の荒らし', broken_shrine: '割れた祠', waiting_ship: '待つ船',
  beloved: '想い人', fond: '親しい人', frail: '弱った人', grave: '墓', missing: '行方知れず', wanderer: '旅の人', oath: '誓い', 'lost-one': '失った人', 'reg-note': '登録の控え',
  backer: '後ろ盾', confide: '打ち明け', false_origin: '偽りの生まれ', farewell: '別れ', hidden_power: '秘めた力', lizard_den: '蜥蜴の巣', deep_floor: '深い階', pupil: '弟子' };

const S = { W: null, seed: 0, cands: null, tab: 'person', relFocus: null, newest: true, open: new Set(), msg: '', stick: false, startTab: 'cands', form: null, detail: new Set(), praying: false,
  mode: null, sub: null, recap: false, toTop: false };   // mode＝null（最初の選択）／'slow'（ゆっくり続ける）／'story'（物語だけを読む＝最初の版）
const isSlow = () => !!(S.W && S.W.town);
const keyNow = () => (S.mode === 'slow' ? SAVE_KEY2 : SAVE_KEY);

// ---------- 道具 ----------
function put(parent, ...kids) { for (const k of kids.flat(3)) { if (k == null || k === false) continue; parent.append(k.nodeType ? k : document.createTextNode(String(k))); } return parent; }
function el(tag, cls, ...kids) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  for (const k of kids.flat(3)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
function btn(label, fn, cls, dis) { const b = el('button', cls || '', label); b.type = 'button'; if (dis) b.disabled = true; else b.addEventListener('click', fn); return b; }
const hero = () => S.W.people[S.W.heroId];
const pAny = id => S.W.people[id] || null;
const nickOf = id => { const p = pAny(id); return p ? p.nick : '？'; };
const placeName = k => D.PLACE_NAME[k] || k;
const SWd = globalThis.StoryWorld || null;
const locLabel = src => src && src.loc && src.loc.name ? src.loc.name + (src.loc.nation ? '（' + src.loc.nation + '）' : '') : placeName(src.place);
const CONTENT_KEY = 'kami-content';
const contentOff = () => { const o = saveable(() => JSON.parse(localStorage.getItem(CONTENT_KEY) || '{}')) || {}; return Object.keys(o).filter(k => o[k] === false); };
const typeName = t => Story.TYPE_NAME(t);
const skillName = id => { const s = D.SKILLS.find(x => x.id === id); return s ? s.name : id; };
const itemName = no => { const i = Story.item(no); return i ? i.name : '物' + no; };
const threadLabel = id => THREAD_LABEL[id] || '名のない糸';   // 英字のキーは画面に出さない
// 糸を張った・引いた時の言い方：エピソードは「第◯話」、小さな場面は「◯月◯日」（小さな場面の中の番号は出さない）
const threadWhen = (turn, date) => (date ? date : '第' + turn + '話');
function say(m) { S.msg = m || ''; const e = document.getElementById('msg'); if (e) e.textContent = S.msg; }
function saveable(f) { try { return f(); } catch (e) { return null; } }

// ---------- 絵 ----------
const spriteCache = {}, sceneCache = {};
const sprKey = (look, build) => look + (build ? '|' + build : '');
function spriteOf(look, build) {
  const k = sprKey(look, build);
  if (!spriteCache[k]) { const r = Chara2.ROLES.find(x => x[0] === look) || Chara2.ROLES[0]; spriteCache[k] = Chara2.compose(build ? Object.assign({}, r[1], { build }) : r[1]); }
  return spriteCache[k];
}
function paint(cv, img) {
  cv.width = img.w; cv.height = img.h;
  const ctx = cv.getContext('2d'), id = ctx.createImageData(img.w, img.h), d = id.data;
  for (let i = 0; i < img.px.length; i++) { const c = img.px[i]; if (!c) continue; d[i * 4] = parseInt(c.slice(1, 3), 16); d[i * 4 + 1] = parseInt(c.slice(3, 5), 16); d[i * 4 + 2] = parseInt(c.slice(5, 7), 16); d[i * 4 + 3] = 255; }
  ctx.putImageData(id, 0, 0);
}
function spriteCv(look, scale, build) {
  const img = spriteOf(look, build), cv = el('canvas', 'px'); paint(cv, img);
  cv.style.width = img.w * scale + 'px'; cv.style.height = img.h * scale + 'px'; cv.setAttribute('aria-label', look);
  return cv;
}
// src＝{ place, time, bg, ids:[関わる人の id] }
function sceneCv(src) {
  const ppl = [hero()];
  (src.ids || []).forEach(id => { const p = pAny(id); if (p && ppl.length < 3 && !ppl.some(q => sprKey(q.look, q.build) === sprKey(p.look, p.build))) ppl.push(p); });
  const bg = src.bg || D.BG[src.place] || 'village', time = src.time || 'day', key = bg + '|' + time + '|' + ppl.map(q => sprKey(q.look, q.build)).join(',');
  if (!sceneCache[key]) { sceneCache[key] = saveable(() => RC.stage({ place: bg, time }, ppl.map(q => spriteOf(q.look, q.build)))) || { w: 192, h: 108, px: new Array(192 * 108).fill('#202848') }; }
  const cv = el('canvas', 'px scene'); paint(cv, sceneCache[key]); cv.dataset.w = sceneCache[key].w; cv.dataset.h = sceneCache[key].h;
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', placeName(src.place) + 'の場面');
  return cv;
}
function fitScenes() {
  document.querySelectorAll('canvas.scene').forEach(cv => {
    const avail = cv.parentElement.clientWidth || 600, w = +cv.dataset.w, h = +cv.dataset.h, k = Math.max(1, Math.min(window.innerWidth >= 1100 ? (window.innerHeight < 1000 ? 2 : 3) : 4, Math.floor(avail / w)));
    const f = k < 2 ? Math.min(avail, w * 2) / w : k;
    cv.style.width = w * f + 'px'; cv.style.height = h * f + 'px';
  });
}

// ---------- 小さな部品 ----------
function heartSvg(on) {
  const s = el('span', 'heart'); s.innerHTML = '<svg viewBox="0 0 16 14" aria-hidden="true"><path d="M8 13 L1.2 6.4 A3.9 3.9 0 0 1 8 2.3 A3.9 3.9 0 0 1 14.8 6.4 Z" fill="' + (on ? '#e27f7f' : 'none') + '" stroke="#e27f7f" stroke-width="1.2"/></svg>'; return s;
}
function bar(pct, cls) { const b = el('div', 'bar ' + (cls || '')), i = el('i'); i.style.width = Math.max(0, Math.min(100, pct)) + '%'; put(b, i); return b; }
function trustBar(t) { const b = el('div', 'tbar'), i = el('i', t >= 0 ? 'pos' : 'neg'); i.style.left = (t >= 0 ? 50 : 50 + t / 2) + '%'; i.style.width = Math.abs(t) / 2 + '%'; put(b, i); return b; }
function fitClass(sc) { return sc >= 2 ? 'e2' : sc === 1 ? 'e1' : sc === 0 ? 'e0' : sc === -1 ? 'm1' : 'm2'; }
function sgn(n) { return (n > 0 ? '+' : '') + n; }

// ---------- 効果の印 ----------
function tagOf(e) {
  const hid = S.W.heroId, T = (cls, text) => el('span', 'tag ' + cls, text);
  if (e.t === 'item' && e.who === hid) return e.n > 0 ? T('item', '＋持ち物 ' + itemName(e.no)) : T('item lost down', '失った ' + itemName(e.no));
  if (e.t === 'skill' && e.who === hid) return T('skill', '＋スキル ' + skillName(e.id) + ' Lv' + e.lv);
  if (e.t === 'rel') { if (e.type) return T('rel', nickOf(e.b) + '：' + ((D.REL_TYPES[e.type] || {}).name || e.type)); if (e.known) return T('rel', nickOf(e.b) + 'の過去を知った'); if (e.d) return T('rel ' + (e.d > 0 ? 'up' : 'down'), nickOf(e.b) + 'との信頼 ' + sgn(e.d)); return null; }
  if (e.t === 'meet') return T('rel', '出会い ' + nickOf(e.id));
  if (e.t === 'stat' && e.who === hid && e.d) return T(e.d > 0 ? 'up' : 'down', e.key + ' ' + sgn(e.d));
  if (e.t === 'death') return T('down', nickOf(e.id) + 'が亡くなった');
  if (e.t === 'flag' && e.who === hid) return T(e.on ? 'down' : 'up', e.flag + (e.on ? 'を負った' : 'が消えた'));
  if (e.t === 'goal') return T(e.d > 0 ? 'up' : 'down', '望み ' + sgn(e.d));
  if (e.t === 'job' && e.who === hid) return T('sys', '職 ' + e.job);
  if (e.t === 'mark') return T(e.on ? 'up' : 'down', (Story.MARKS[e.name] || e.name) + (e.on ? ' になった' : ' でなくなった'));
  if (e.t === 'missing') return T('down', nickOf(e.id) + 'が行方知れずになった');
  if (e.t === 'found') return T('up', nickOf(e.id) + 'が見つかった');
  if (e.t === 'away') return T('sys', nickOf(e.id) + 'が旅に出た');
  if (e.t === 'back') return T('up', nickOf(e.id) + 'が旅から戻った');
  return null;
}
const tagsOf = effs => (effs || []).map(tagOf).filter(Boolean);
// 効果をまとめて印にする（同じ能力値は足す）
function sumTags(effs) {
  const stat = {}, rest = [];
  (effs || []).forEach(e => { if (e.t === 'stat' && e.who === S.W.heroId) stat[e.key] = (stat[e.key] || 0) + e.d; else rest.push(e); });
  const st = Object.keys(stat).filter(k => stat[k]).map(k => el('span', 'tag ' + (stat[k] > 0 ? 'up' : 'down'), k + ' ' + sgn(stat[k])));
  return tagsOf(rest).concat(st);
}

// ---------- 文の表示 ----------
function lineEls(l) {
  const out = [];
  if (l.tm) out.push(el('p', 'lt', '— ' + (TIME_NAME[l.tm] || l.tm) + 'になった —'));
  if (l.k === 'c') out.push(el('p', 'lc', '▼ ' + l.t));
  else if (l.k === 's') out.push(el('p', 'lsay', el('b', '', l.name + '：'), '『' + l.t + '』'));
  else if (l.k === 'n') out.push(el('p', 'ln' + (l.trig ? ' trigLine' : '') + (l.persona ? ' personaLine' : ''), l.t));
  else out.push(el('p', '', l.t));
  const t = tagsOf(l.fx); if (t.length) out.push(el('div', 'tags', t));
  return out;
}
function partsView(parts) {
  if (!parts || !parts.length) return null;
  const w = el('div', 'parts', el('span', 'muted', '内訳'));
  parts.forEach(x => put(w, el('span', 'part ' + (x.d > 0 && x.name !== '基礎' ? 'up' : x.d < 0 ? 'down' : ''), x.name + ' ' + (x.name === '基礎' ? x.d : sgn(x.d)))));
  return w;
}
function chanceRow(chance, parts) {
  const b = bar(chance, 'chance'); b.querySelector('i').style.width = chance + '%';
  return el('div', '', el('div', 'chanceRow', el('b', '', '成功率 ' + chance + '%'), b), partsView(parts));
}
const whenOf = src => (src.year ? src.year + '年目・' : '') + (src.season || '') + (src.month ? src.month + '月' : '');

  afterOp(r, r.moment ? '小さな場面が始まった。' : '');
}
function doGoRumor(rid) { const r = Town.goRumor(S.W, rid); if (!r.ok) { autosave(); say(r.reason); render(); return; } S.sub = null; S.stick = false; afterOp(r, '物語が始まった。'); }
function doPassRumor(rid) { const r = Town.passRumor(S.W, rid); afterOp(r, r.ok ? '見送った。噂は数日残って、やがて消える。' : r.reason); }
function doQuest(qid) { const r = Town.takeQuest(S.W, qid); if (!r.ok) { autosave(); say(r.reason); render(); return; } S.sub = null; afterOp(r, '依頼を受けた。'); }
function doTalk(pid) { const r = Town.act(S.W, 'talk', pid); if (!r.ok) { say(r.reason); render(); return; } afterOp(r, ''); }
function doReply(i) { const r = Town.talkReply(S.W, i); if (!r.ok) { say(r.reason); render(); return; } afterOp(r, ''); }
function doTalkEnd() { const r = Town.talkEnd(S.W); if (!r.ok) { say(r.reason || ''); render(); return; } afterOp(r, r.moment ? '小さな場面が始まった。' : ''); }
function doBuy(no) { const r = Town.buy(S.W, no); S.toTop = false; autosave(); say(r.ok ? r.text : r.reason); S.W.town.feed = [{ k: 't', t: r.ok ? r.text : r.reason }]; render(); }
function doSell(no) { const r = Town.sell(S.W, no); S.toTop = false; autosave(); say(r.ok ? r.text : r.reason); S.W.town.feed = [{ k: 't', t: r.ok ? r.text : r.reason }]; render(); }
function doLeaveShop() { const r = Town.leaveShop(S.W); afterOp(r, r.moment ? '小さな場面が始まった。' : ''); }
function doLeaveWrap() { Town.leaveWrap(S.W); afterOp({}, ''); }
function doWish(choice) { const r = Town.wish(S.W, choice); afterOp(r, r.ended ? '' : '旅を続ける。'); }
function doRetire() { if (!confirm('旅を終えて、静かに暮らしますか？\n（この人生は、ここで結びになります）')) return; const r = Town.retire(S.W); if (!r.ok) { say(r.reason); render(); return; } afterOp(r, ''); }

// ---------- 操作 ----------
function autosave() { saveable(() => localStorage.setItem(keyNow(), isSlow() ? Town.save(S.W) : Player.save(S.W))); }
function doSave() { if (!S.W) return; const ok = saveable(() => { localStorage.setItem(keyNow(), isSlow() ? Town.save(S.W) : Player.save(S.W)); return true; }); say(ok ? '保存した（' + (isSlow() ? Town.dateParts(S.W).text : '第' + S.W.turn + '話まで') + (S.W.cur ? '・読みかけの途中も' : '') + '）。' : '保存できなかった（この環境では使えないかもしれない）。'); renderTop(); }
function doLoad() {
  const s = saveable(() => localStorage.getItem(keyNow())); if (!s) { say('保存されたデータがない。'); return; }
  try {
    Town.cleanup();
    S.W = S.mode === 'slow' ? Town.load(s) : Player.load(s); S.relFocus = null; S.open = new Set(); S.detail = new Set(); S.praying = false; S.tab = 'person'; S.stick = true; S.sub = null;
    S.recap = isSlow(); say(isSlow() ? '読み込んだ（' + Town.dateParts(S.W).text + '）。' : '読み込んだ（第' + S.W.turn + '話まで）。'); render();
  }
  catch (e) { say('読み込めなかった：' + e.message); if (!S.W) render(); }
}
function start(c) {
  Town.cleanup();
  if (S.mode === 'slow') { S.W = Town.newWorld(S.seed, c, { contentOff: contentOff() }); S.relFocus = null; S.open = new Set(); S.detail = new Set(); S.praying = false; S.tab = 'person'; S.sub = null; S.recap = false; Town.start(S.W); Town.advance(S.W); autosave(); say('転生した。'); S.stick = true; render(); window.scrollTo(0, 0); return; }
  S.W = Player.newWorld(S.seed, c, { contentOff: contentOff() }); S.relFocus = null; S.open = new Set(); S.detail = new Set(); S.praying = false; S.tab = 'person';
  Story.next(S.W); Story.advance(S.W); autosave(); say('転生した。'); S.stick = true; render(); window.scrollTo(0, 0);
}
function newLife() {
  if (S.W && !S.W.over && S.W.log.length && !confirm('いまの人生は途中です。やめて、新しい人生を始めますか？\n（自動保存された続きは、「続きから」「読み込み」で戻せます）')) return;
  Town.cleanup(); S.W = null; S.seed = Math.floor(Math.random() * 100000); S.cands = null; S.praying = false; S.sub = null; S.recap = false; say(''); render(); window.scrollTo(0, 0); }
function doNextEp() { if (!S.W || S.W.over || S.W.cur) return; Story.next(S.W); Story.advance(S.W); autosave(); say(''); S.stick = true; render(); }
function doAdvance() { if (!S.W || !S.W.cur || S.W.cur.choice) return; if (isSlow()) Town.advance(S.W); else Story.advance(S.W); autosave(); say(''); S.stick = true; render(); }
function doChoose(key, hold) {
  if (!S.W || !S.W.cur || !S.W.cur.choice) return;
  const r = isSlow() ? Town.choose(S.W, key) : Player.choose(S.W, key);
  if (!r.ok) { say(r.reason); render(); return; }
  S.praying = false; autosave(); say(r.changed ? '生き方が変わった。' : r.held ? '踏みとどまった（心 −1）。' : ''); S.stick = true; render();
}
function doPray(kind) {
  const r = isSlow() ? Town.pray(S.W, kind) : Player.pray(S.W, kind);
  if (!r.ok) { say(r.reason); render(); return; }
  S.praying = false; autosave(); say(kind === 'blessing' ? '加護を願った。' : '神の声を聞いた。'); render();
}
window.addEventListener('resize', fitScenes);


// ---------- 起動 ----------
S.seed = Math.floor(Math.random() * 100000);
window.__story = S; // 動作確認用
const q = new URLSearchParams(location.search).get('seed'); if (q && Number.isFinite(+q)) S.seed = +q;
{ const m = new URLSearchParams(location.search).get('mode'); if (m === 'slow' || m === 'story') S.mode = m; }
render();
}
})();
</script>
</body>
</html>
